<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="description" content="Cafe One Login">
    <meta name="keywords" content="Cafe One, Login">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafe One | Login</title>

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@200;300;400;600;900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">

    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg,#f7f4ef,#ffffff,#eef7ef);
        }

        .login-hero{
            min-height:100vh;
            display:flex;
            align-items:center;
        }

        .login-card{
            background:#fff;
            border-radius:20px;
            padding:40px;
            box-shadow:0 20px 60px rgba(0,0,0,.08);
        }

        .site-btn{
            width:100%;
            border:none;
            padding:14px;
            background:#7fad39;
            color:#fff;
            font-weight:bold;
            cursor:pointer;
        }

        input{
            width:100%;
            padding:12px;
            border:1px solid #ddd;
            margin-bottom:20px;
        }

        #login-status{
            min-height:24px;
        }
    </style>
</head>

<body>

<section class="login-hero">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-5">

                <div class="login-card">

                    <h2>Approved User Login</h2>

                    <p>Approved cafe users and admins can sign in here.</p>

                    <form id="login-form">

                        <label>Email</label>
                        <input
                            type="email"
                            id="login-email"
                            placeholder="Approved Email"
                            required>

                        <label>Access Code</label>
                        <input
                            type="password"
                            id="login-access-code"
                            placeholder="Access Code"
                            required>

                        <p id="login-status"></p>

                        <button class="site-btn" type="submit">
                            SIGN IN
                        </button>

                    </form>

                    <br>

                    <a href="index.html">
                        ← Back to Home
                    </a>

                </div>

            </div>
        </div>
    </div>
</section>

<script src="js/jquery-3.3.1.min.js"></script>

<!-- IMPORTANT -->
<script src="js/login.js"></script>
<!-- <script src="js/main.js"></script> -->

</body>
</html>
